name: Bug report
description: Report a ZeroStack coordinator problem with a scrubbed log trace from the Log Analyzer
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before you file — Why `debug` logs get bugs fixed fast
        Standard `info` or `error` logs only show the final symptom (like a "timeout" or "delivery failed" message), not what caused it.

        Enabling **`debug` logging** records the actual conversation between your smart home software and the coordinator right before the error occurred. With a debug log, we can **replay and reproduce the exact bug in our lab** to fix the root cause instead of guessing.
        ---

        ### 1. Enable `debug` logging and reproduce the problem once
        - **Zigbee2MQTT:** Set `advanced: log_level: debug` in `configuration.yaml` (or launch with `DEBUG=zigbee-herdsman*` so raw `znp:SREQ` / `znp:AREQ` frames are recorded), restart, reproduce the issue, and download the log file.
        - **Home Assistant (ZHA):** Go to **Settings → Devices & services → Zigbee Home Automation**, click **`⋮` → Enable debug logging**, reproduce the problem (or click **`⋮` → Reload** if the issue happens on startup), then click **Disable debug logging** to automatically download the log file.

        ### 2. Scrub & extract with the [Log Analyzer (Bug Report Mode)](https://smlight-tech.github.io/zerostack/?mode=bug-report)
        Drop your debug log into the analyzer. It runs **entirely in your browser** (no data leaves your machine) and automatically:
        - **Scrubs all network and link keys** into deterministic `<KEY:xxxx>` tags so key mismatches stay visible without exposing secrets.
        - **Masks IEEE addresses** (retaining the OUI prefix and final byte so device routing remains traceable) and strips local file paths.
        - **Extracts the exact ZNP command sequence** immediately preceding each fault.

        Click **Copy for GitHub** and paste the result into the **Log Analyzer output** field below.

        > ⚠️ **Security note:** Never paste a raw `coordinator_backup.json`, `configuration.yaml`, or unscrubbed debug log directly into an issue — they contain your plaintext Zigbee network key inside NVRAM read/write payloads.
  - type: input
    id: hardware
    attributes:
      label: Coordinator hardware model
      description: Enter your SMLIGHT model as shown in the web UI or device label (for multi-radio models, note which radio slot if applicable).
      placeholder: e.g. SLZB-06p7, SLZB-06U, SLZB-MR1, SMHUB, SMHUB-Nano...
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection type
      options:
        - USB (serial)
        - Ethernet (TCP socket)
        - Wi-Fi (TCP socket)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: ZeroStack firmware version
      description: As shown in the SLZB web UI or the Log Analyzer summary table.
      placeholder: 0.9.10-beta.2 (20260101)
    validations:
      required: true
  - type: input
    id: previous-firmware
    attributes:
      label: Previous firmware (if migrating or restoring a backup)
      placeholder: Koenkk Z-Stack 20260310
    validations:
      required: false
  - type: input
    id: host-stack
    attributes:
      label: Host stack and version
      placeholder: Zigbee2MQTT 2.14.3 / zigbee-herdsman 11.2.0, or ZHA (Home Assistant 2026.11)
    validations:
      required: true
  - type: textarea
    id: bug-report
    attributes:
      label: Log Analyzer Bug Report output
      description: Paste the Markdown from Bug Report Mode unchanged. It starts with `<!-- zerostack-bug-report v1 -->`.
      placeholder: "<!-- zerostack-bug-report v1 -->"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Steps to reproduce / what happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Flashed ZeroStack over Koenkk Z-Stack and restarted Zigbee2MQTT
        2. Zigbee2MQTT restored the coordinator backup
        3. Startup failed with ...
    validations:
      required: true
