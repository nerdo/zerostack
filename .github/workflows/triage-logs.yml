name: Triage Zigbee & Thread Logs

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  triage-logs:
    runs-on: ubuntu-latest
    if: >-
      github.event.sender.type != 'Bot' &&
      !contains(github.event.comment.body || github.event.issue.body || '', '## ZeroStack Log Analyzer — Bug Report') &&
      !contains(github.event.comment.body || github.event.issue.body || '', '<!-- zerostack-auto-log-report')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Extract logs, run analyzer, and post sticky triage comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');

            const isComment = Boolean(context.payload.comment);
            const issue = context.payload.issue;
            const target = isComment ? context.payload.comment : issue;
            const body = (target && target.body) || '';
            if (!body.trim()) return;

            if (
              body.includes('## ZeroStack Log Analyzer — Bug Report') ||
              body.includes('<!-- zerostack-auto-log-report') ||
              body.includes('<!-- z2m-log-analyzer-missing-context -->')
            ) {
              core.info('Body already contains an auto-generated triage comment; skipping.');
              return;
            }

            const issueLabels = Array.isArray(issue?.labels)
              ? issue.labels.map((l) => (typeof l === 'string' ? l : l?.name || '').toLowerCase()).filter(Boolean)
              : [];
            const hasBugLabel = issueLabels.includes('bug');
            const hasTemplateHeadings =
              /###\s+(?:Coordinator hardware model|Log Analyzer Bug Report output|Steps to reproduce)/i.test(body);
            const errorSymptomRe =
              /\b(?:Error:|SRSP|timeout|pan_id|channel_mask|Cannot backup|not commissioned|MEM_ERROR|BUFFER_FULL|NWK_TABLE_FULL|MAC_NO_ACK|MAC_CHANNEL_ACCESS_FAILURE)\b/i;
            const isBugReport = !isComment && (hasBugLabel || hasTemplateHeadings || errorSymptomRe.test(body));

            const markerRe = /(?:zh:zstack:|z2m:|zigpy|bellows|otbr-agent|SRSP\s*-|osalNv|nvWrite|leaveInd|tcDeviceInd)/i;
            const attachmentRe = /https:\/\/github\.com\/user-attachments\/files\/[^\s)>\]]+\.(?:log|txt)(?:\?[^\s)>\]]*)?/gi;
            const attachmentUrls = [...new Set(body.match(attachmentRe) || [])];

            const chunks = [];
            const fencedMatches = [...body.matchAll(/```[^\n]*\n([\s\S]*?)```/g)];
            const fencedText = fencedMatches
              .map((m) => (m[1] || '').trim())
              .filter(Boolean)
              .join('\n');
            if (fencedText && (markerRe.test(fencedText) || errorSymptomRe.test(fencedText))) {
              chunks.push(fencedText);
            } else if (markerRe.test(body) || errorSymptomRe.test(body) || isBugReport) {
              chunks.push(body);
            }

            const MAX_BYTES = 15 * 1024 * 1024;
            const validAttachmentUrlRe = /^https:\/\/github\.com\/user-attachments\/files\//;
            for (const url of attachmentUrls) {
              if (!validAttachmentUrlRe.test(url)) {
                core.warning(`Skipping invalid attachment URL: ${url}`);
                continue;
              }
              try {
                const res = await fetch(url, { redirect: 'follow' });
                if (!res.ok) {
                  core.warning(`Failed to fetch attachment ${url}: HTTP ${res.status}`);
                  continue;
                }
                const contentLen = Number(res.headers.get('content-length') || '0');
                if (contentLen > MAX_BYTES) {
                  core.warning(`Skipping attachment ${url}: exceeds 15 MB (${contentLen} bytes)`);
                  continue;
                }
                const buf = Buffer.from(await res.arrayBuffer());
                if (buf.byteLength > MAX_BYTES) {
                  core.warning(`Skipping attachment ${url}: downloaded body exceeds 15 MB (${buf.byteLength} bytes)`);
                  continue;
                }
                const text = buf.toString('utf8');
                if (text.trim()) chunks.push(text);
              } catch (err) {
                core.warning(`Error fetching attachment ${url}: ${err && err.message ? err.message : String(err)}`);
              }
            }

            let analysis = {
              contextSufficiency: 'no-wire-frames',
              mtCommandCount: 0,
              preFaultMtCommandCount: 0,
              hasStartupContext: false,
              faultsCount: 0,
              markdown: '',
            };

            const combined = chunks.join('\n');
            if (combined.trim()) {
              const logPath = '/tmp/extracted.log';
              fs.writeFileSync(logPath, combined, 'utf8');
              try {
                const rawJson = execFileSync(
                  'node',
                  ['.github/scripts/z2m-log-analyzer.mjs', logPath, '--bug-report-json'],
                  { encoding: 'utf8', maxBuffer: 10 * 1024 * 1024 }
                ).trim();
                if (rawJson) {
                  analysis = JSON.parse(rawJson);
                }
              } finally {
                try { fs.unlinkSync(logPath); } catch {}
              }
            }

            const hasSufficientLog =
              analysis.mtCommandCount >= 5 &&
              (analysis.faultsCount === 0 || analysis.preFaultMtCommandCount >= 5);

            const upsertComment = async (marker, commentBody) => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              const existing = comments.find((c) => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: commentBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: commentBody,
                });
              }
            };

            const removeDebugLabelsIfPresent = async () => {
              for (const labelName of ['needs-debug-log', 'needs-debug-logs']) {
                if (issueLabels.includes(labelName)) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      name: labelName,
                    });
                  } catch (err) {
                    core.warning(`Could not remove label ${labelName}: ${err && err.message ? err.message : String(err)}`);
                  }
                }
              }
            };

            if (isComment) {
              if (!hasSufficientLog) {
                core.info(
                  `Comment has insufficient wire context (mtCommandCount=${analysis.mtCommandCount}, preFaultMtCommandCount=${analysis.preFaultMtCommandCount}); skipping.`
                );
                return;
              }
              const reportMarkdown = (analysis.markdown || '').trim();
              if (!reportMarkdown) return;
              const marker = `<!-- zerostack-auto-log-report source:comment-${target.id} -->`;
              const commentBody = reportMarkdown.startsWith('## ZeroStack Log Analyzer')
                ? [marker, reportMarkdown].join('\n')
                : [marker, '## ZeroStack Log Analyzer — Bug Report', '', reportMarkdown].join('\n');
              await upsertComment(marker, commentBody);
              await removeDebugLabelsIfPresent();
              return;
            }

            if (hasSufficientLog) {
              await removeDebugLabelsIfPresent();
              if (body.includes('<!-- zerostack-bug-report v1 -->')) {
                core.info('Issue OP already contains verbatim --bug-report output; skipping duplicate comment.');
                return;
              }
              const reportMarkdown = (analysis.markdown || '').trim();
              if (!reportMarkdown) return;
              const marker = `<!-- zerostack-auto-log-report source:issue-${issue.number} -->`;
              const commentBody = reportMarkdown.startsWith('## ZeroStack Log Analyzer')
                ? [marker, reportMarkdown].join('\n')
                : [marker, '## ZeroStack Log Analyzer — Bug Report', '', reportMarkdown].join('\n');
              await upsertComment(marker, commentBody);
              return;
            }

            if ((isBugReport || analysis.faultsCount > 0) && (analysis.mtCommandCount === 0 || analysis.preFaultMtCommandCount < 5)) {
              const missingMarker = '<!-- z2m-log-analyzer-missing-context -->';
              const missingBody = [
                missingMarker,
                '### Missing Pre-Error Debug Log',
                '',
                `Only **${analysis.preFaultMtCommandCount}** MT/ZNP wire frame(s) were found before the error (**${analysis.mtCommandCount}** total); at least **200 lines of debug log prior to the error** (or logs starting from coordinator startup) are required for root-cause diagnosis.`,
                '',
                'Please enable `debug` logging (`advanced: log_level: debug` in Zigbee2MQTT, or **Enable debug logging** in ZHA), reproduce the issue, and attach the `.log`/`.txt` file or paste the scrubbed output from the [Log Analyzer](https://smlight-tech.github.io/zerostack/?mode=bug-report) in a reply below.',
                '',
                '#### Copy-Paste Prompt for AI Assistants (Claude / ChatGPT / Cursor)',
                '```text',
                'Analyze my full Zigbee2MQTT/ZHA debug log using the official ZeroStack Bug Report Analyzer before replying:',
                'curl -fsSL https://raw.githubusercontent.com/smlight-tech/zerostack/main/.github/scripts/z2m-log-analyzer.mjs | node - <path-to-z2m-log> --bug-report --require-context',
                '(Or connect your MCP client to: node .github/scripts/z2m-log-analyzer-mcp.mjs and call prepare_zerostack_bug_report.)',
                'Paste the resulting <!-- zerostack-bug-report v1 --> block verbatim.',
                '```',
              ].join('\n');
              await upsertComment(missingMarker, missingBody);
              if (!issueLabels.includes('needs-debug-log') && !issueLabels.includes('needs-debug-logs')) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['needs-debug-log'],
                });
              }
              return;
            }

            core.info('Case 3: Not a bug report and 0 faults / 0 MT commands; skipping comment.');
