name: Triage Zigbee & Thread Logs

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  triage-logs:
    runs-on: ubuntu-latest
    if: >-
      github.event.sender.type != 'Bot' &&
      !contains(github.event.comment.body || github.event.issue.body || '', '## ZeroStack Log Analyzer — Bug Report') &&
      !contains(github.event.comment.body || github.event.issue.body || '', '<!-- zerostack-auto-log-report')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Extract logs, run analyzer, and post sticky triage comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');

            const isComment = Boolean(context.payload.comment);
            const target = isComment ? context.payload.comment : context.payload.issue;
            const body = (target && target.body) || '';
            if (!body.trim()) return;

            if (
              body.includes('## ZeroStack Log Analyzer — Bug Report') ||
              body.includes('<!-- zerostack-auto-log-report')
            ) {
              core.info('Body already contains an auto-generated bug report; skipping.');
              return;
            }

            const markerRe = /(?:zh:zstack:|z2m:|zigpy|bellows|otbr-agent|SRSP\s*-|osalNv|nvWrite|leaveInd|tcDeviceInd)/i;
            const attachmentRe = /https:\/\/github\.com\/user-attachments\/files\/[^\s)>\]]+\.(?:log|txt)(?:\?[^\s)>\]]*)?/gi;
            const attachmentUrls = [...new Set(body.match(attachmentRe) || [])];

            if (!markerRe.test(body) && attachmentUrls.length === 0) {
              core.info('No Zigbee/Thread log markers or .log/.txt attachment URLs detected; skipping.');
              return;
            }

            const chunks = [];
            const fencedMatches = [...body.matchAll(/```[^\n]*\n([\s\S]*?)```/g)];
            const fencedText = fencedMatches
              .map((m) => (m[1] || '').trim())
              .filter(Boolean)
              .join('\n');
            if (fencedText && markerRe.test(fencedText)) {
              chunks.push(fencedText);
            } else if (markerRe.test(body)) {
              chunks.push(body);
            }

            const MAX_BYTES = 15 * 1024 * 1024;
            const validAttachmentUrlRe = /^https:\/\/github\.com\/user-attachments\/files\//;
            for (const url of attachmentUrls) {
              if (!validAttachmentUrlRe.test(url)) {
                core.warning(`Skipping invalid attachment URL: ${url}`);
                continue;
              }
              try {
                const res = await fetch(url, { redirect: 'follow' });
                if (!res.ok) {
                  core.warning(`Failed to fetch attachment ${url}: HTTP ${res.status}`);
                  continue;
                }
                const contentLen = Number(res.headers.get('content-length') || '0');
                if (contentLen > MAX_BYTES) {
                  core.warning(`Skipping attachment ${url}: exceeds 15 MB (${contentLen} bytes)`);
                  continue;
                }
                const buf = Buffer.from(await res.arrayBuffer());
                if (buf.byteLength > MAX_BYTES) {
                  core.warning(`Skipping attachment ${url}: downloaded body exceeds 15 MB (${buf.byteLength} bytes)`);
                  continue;
                }
                const text = buf.toString('utf8');
                if (text.trim()) chunks.push(text);
              } catch (err) {
                core.warning(`Error fetching attachment ${url}: ${err && err.message ? err.message : String(err)}`);
              }
            }

            const combined = chunks.join('\n');
            if (!combined.trim()) {
              core.info('No non-empty log content extracted; skipping.');
              return;
            }

            const logPath = '/tmp/extracted.log';
            fs.writeFileSync(logPath, combined, 'utf8');

            let reportMarkdown = '';
            try {
              reportMarkdown = execFileSync(
                'node',
                ['.github/scripts/z2m-log-analyzer.mjs', logPath, '--bug-report', '--skip-empty'],
                { encoding: 'utf8', maxBuffer: 10 * 1024 * 1024 }
              ).trim();
            } finally {
              try { fs.unlinkSync(logPath); } catch {}
            }

            if (!reportMarkdown) {
              core.info('Analyzer produced empty output; skipping.');
              return;
            }

            const sourceTag = isComment ? `comment-${target.id}` : `issue-${context.payload.issue.number}`;
            const marker = `<!-- zerostack-auto-log-report source:${sourceTag} -->`;
            const commentBody = reportMarkdown.startsWith('## ZeroStack Log Analyzer')
              ? [marker, reportMarkdown].join('\n')
              : [marker, '## ZeroStack Log Analyzer — Bug Report', '', reportMarkdown].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: commentBody,
              });
            }
